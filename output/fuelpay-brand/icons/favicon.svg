<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FuelPay">
  <title>FuelPay level mark — Netpoc edition</title>
  <!--
    Geometry is exact (see fuelpay-brand/manual.html): body circle C=(16,20)
    r=9.5, apex (16,3), tangent points (8.12,14.69) and (23.88,14.69). The
    outline is drawn once, unbroken; only the fill is cut at y=18.1.

    Netpoc edition: the mark sits on a night tile so it reads on light and dark
    browser chrome alike, the outline is ivory, and the diesel is the Ankara
    saffron→coral pair.
  -->
  <defs>
    <clipPath id="lm-fill"><rect x="0" y="18.1" width="32" height="13.9"/></clipPath>
    <linearGradient id="lm-diesel" x1="0" y1="18" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7B733"/>
      <stop offset="1" stop-color="#FF5E5B"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0B0A1A"/>
  <g transform="translate(16 16.6) scale(0.86) translate(-16 -16)">
    <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="#F5F2EA" fill-opacity="0.08"/>
    <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="url(#lm-diesel)" clip-path="url(#lm-fill)"/>
    <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="none" stroke="#F5F2EA" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
</svg>
