<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FuelPay, empty">
  <title>FuelPay level mark, empty</title>
  <!-- The surface sits at the floor. Used on the 404: the mark that normally
       says "you have fuel" says "there is nothing here". -->
  <defs>
    <clipPath id="lme-fill"><rect x="0" y="28.4" width="32" height="3.6"/></clipPath>
  </defs>
  <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="currentColor" fill-opacity="0.05"/>
  <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="currentColor" fill-opacity="0.28" clip-path="url(#lme-fill)"/>
  <path d="M16 3 L8.12 14.69 A9.5 9.5 0 1 0 23.88 14.69 Z" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
