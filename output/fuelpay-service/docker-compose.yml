services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuelpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuelpay}
      POSTGRES_DB: ${POSTGRES_DB:-fuelpay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fuelpay_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Without -d, pg_isready checks the default db (named after the user) and can
      # report ready before the real database exists.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuelpay} -d ${POSTGRES_DB:-fuelpay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FUELPAY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fuelpay}:${POSTGRES_PASSWORD:-fuelpay}@db:5432/${POSTGRES_DB:-fuelpay}
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  fuelpay_pgdata:
