[project]
name = "fuelpay-service"
version = "0.1.0"
description = "FuelPay MVP — diesel genset fuel telemetry simulation backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The [asyncio] extra is what pulls in greenlet, which SQLAlchemy's async
    # layer needs to bridge its sync internals. Without it every query raises
    # "the greenlet library is required" at runtime.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is expressed as callables in defaults.
# B008 is right in general and wrong here.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit `packages = ["app"]` would omit app.models / app.simulation and ship
# a broken wheel into the Docker image.
include = ["app*"]
